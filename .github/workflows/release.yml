name: Release

# 配布ファイルを作るワークフロー。
#  - v から始まるタグを push  … ビルドして GitHub Release に添付する
#  - 画面から手動実行         … ビルドして Actions の成果物としてだけ残す（お試し用）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon ランナー
            name: mac-arm64
            script: dist:mac
          - os: windows-latest
            name: win-x64
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: 配布ファイルを作成
        env:
          # Developer ID を持っていないので、キーチェーンの証明書を勝手に拾わせない。
          # macOS 版は afterPack フック（scripts/adhoc-sign.mjs）でアドホック署名される。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  release:
    # タグを push したときだけ Release を作る
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release を作成して添付
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          mapfile -t files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \))
          printf '添付するファイル:\n%s\n' "${files[@]}"
          gh release upload "$TAG" --clobber "${files[@]}"
